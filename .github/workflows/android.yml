name: Build SUMAX APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK and required packages
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$sdk" > local.properties
          if [[ -f "$sdk/platforms/android-35/android.jar" && -x "$sdk/build-tools/35.0.0/aapt2" ]]; then
            echo "Required SDK packages already installed"
            exit 0
          fi
          manager="$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$manager"
          test -x "$manager"
          "$manager" --sdk_root="$sdk" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUMAX-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
